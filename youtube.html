<!DOCTYPE html>
<html>
    <head>
        <title>YouTube.com Clone</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            p{
                font-family: Roboto, Arial;
                margin-top: 0;
                margin-bottom: 0;
            }
            .video-preview{
                width: 300px;
                display: inline-block;
                vertical-align: top;
                margin-right: 15px;
            }
            .video-title{
                margin-top: 0px;
                font-size: 14px;
                font-weight: 500;
                line-height: 20px;
                margin-bottom: 12px;
            }
            .video-author, .video-stats{
                font-size: 12px;
                color: rgb(96,96,96);
            }
            .video-author{
                margin-bottom: 4px;
            }
            .thumbnail{
                width: 300px;
                display: block;
            }
            .thumbnail-row{
                margin-bottom: 12px;
            }
            .search-bar{
                font-size: 20px;
                margin-left: 20px;
                display: block;
            }
            .channel-picture{
                display: inline-block;
                width: 50px;
                vertical-align: top;
            }
            .profile-picture{
                width: 40px;
                border-radius: 50px;
            }
            .video-info{
                display: inline-block;
                width: 240px;
            }
        </style>
    </head>
    <body>
        <input class="search-bar" type="text" placeholder="Search">
        <div class="video-preview">
            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-1.avif">
            </div>
            <div>
                <div class="channel-picture">
                    <img class="profile-picture" src="channel-pictures/channel-1.jpg">
                </div>
                <div class="video-info">
                    <p class="video-title">These are the best AI Tools in 2026</p>
                    <p class="video-author">Dan Martell</p>
                    <p class="video-stats">205k &#183; 3 days ago</p>
                </div>
            </div>
        </div>
        <div class="video-preview">
            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-2.avif">
            </div>
            <div>
                <div class="channel-picture">
                    <img class="profile-picture" src="channel-pictures/channel-2.jpg">
                </div>
                <div class="video-info">
                    <p class="video-title">Introducing Meta VR Glasses | Spring 2027</p>
                    <p class="video-author">Meta VR</p>
                    <p class="video-stats">622k &#183; 3 days ago</p>
                </div>
            </div>
        </div>

        <div class="video-preview">
            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-3.avif">
            </div>
            <div>
                <div class="channel-picture">
                    <img class="profile-picture" src="channel-pictures/channel-3.jpg">
                </div>
                <div class="video-info">
                    <p class="video-title">Face Massage With Olive Oil for Glowing Skin | 10 Steps</p>
                    <p class="video-author">Love Yourself Fitness by Rita</p>
                    <p class="video-stats">1m &#183; 3 yr ago</p>
                </div>
            </div>
        </div>
       
    </body>
</html>
